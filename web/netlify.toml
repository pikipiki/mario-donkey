[build]
  command = "npm ci && npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[[headers]]
  for = "/emulator/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
