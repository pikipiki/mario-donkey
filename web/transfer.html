<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reprendre ma partie · Kong × Yoshi</title><style>[hidden]{display:none!important}body{font:18px system-ui;background:#111b1e;color:#edf4e4;max-width:650px;margin:10vh auto;padding:24px;line-height:1.6}button,a{display:inline-block;background:#c8e88b;color:#172823;padding:16px;border:0;border-radius:12px;font:inherit;cursor:pointer}button:disabled{opacity:.4}iframe{display:none}a{margin-top:16px}</style><h1>Reprendre ma partie.</h1><p>Copier la dernière sauvegarde de l’ancienne version locale vers la version corrigée. La partie d’origine reste conservée.</p><button id="copy" disabled>Copier ma sauvegarde</button><p id="status" role="status">Préparation…</p><a id="play" href="/?debug=1&amp;test=1" hidden>Jouer à la version corrigée</a><script>
const KEY='campaign-v2-original-dkc-eu-snes9x-2.0.2',DB='kong-island-local-test-v2',source='http://127.0.0.1:5174',target='http://127.0.0.1:5175',status=document.getElementById('status'),button=document.getElementById('copy');
function database(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function read(){const db=await database();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('files'),s=tx.objectStore('files'),campaign=s.get(KEY),rom=s.get('rom');tx.oncomplete=()=>resolve({campaign:campaign.result,rom:rom.result});tx.onerror=()=>reject(tx.error)})}finally{db.close()}}
if(new URLSearchParams(location.search).has('source')){
 button.hidden=true;status.textContent='Lecture locale, uniquement sur demande de la version corrigée.';
 addEventListener('message',async e=>{if(e.origin!==target||e.source!==parent||e.data?.type!=='kong-copy-request')return;try{const data=await read();if(!data.campaign)throw Error('Aucune sauvegarde de campagne trouvée.');parent.postMessage({type:'kong-copy-data',...data},target)}catch(error){parent.postMessage({type:'kong-copy-error',message:error.message},target)}});
}else if(location.origin===target){
 const frame=document.createElement('iframe');frame.src=source+'/node_modules/.cache/kong-transfer-walls.html?source=1';frame.onload=()=>{button.disabled=false;status.textContent='Prêt à copier la dernière sauvegarde enregistrée.'};document.body.append(frame);
 button.onclick=()=>{button.disabled=true;status.textContent='Copie locale en cours…';frame.contentWindow.postMessage({type:'kong-copy-request'},source)};
 addEventListener('message',async e=>{if(e.origin!==source||e.source!==frame.contentWindow)return;if(e.data?.type==='kong-copy-error'){status.textContent=e.data.message;button.disabled=false;return}if(e.data?.type!=='kong-copy-data'||!(e.data.campaign instanceof Uint8Array))return;try{const previous=await read(),db=await database();try{await new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite'),s=tx.objectStore('files');if(previous.campaign)s.put(previous.campaign,'before-transfer-'+Date.now());s.put(e.data.campaign,KEY);if(e.data.rom instanceof Uint8Array)s.put(e.data.rom,'rom');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{db.close()}status.textContent='Copie terminée. La partie d’origine est conservée.';document.getElementById('play').hidden=false}catch(error){status.textContent=error.message;button.disabled=false}});
}else{status.textContent='Cet outil local attend la version corrigée sur le port 5175.'}
</script></html>
