<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Recette mobile · Kong × Yoshi</title><style>body{margin:0;padding:12px;background:#e4e0d4;font:14px system-ui}nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}button{min-height:44px;padding:10px;border:1px solid #333;border-radius:8px;background:white;font:inherit}iframe{display:block;border:2px solid #333;background:#111b1e;max-width:none;transform-origin:top left}pre{font:11px monospace;white-space:pre-wrap}</style></head><body><nav aria-label="Format à vérifier"><button id="portrait">Portrait 375 × 812</button><button id="landscape">Paysage 812 × 375</button><button id="small">Petit écran 320 × 568</button><button id="audit">Mesurer les commandes</button><span id="format">375 × 812</span></nav><iframe id="device" title="Aperçu mobile" src="/?test=1" width="375" height="812" allowfullscreen></iframe><pre id="report" role="status"></pre><script>const f=document.getElementById('device');function size(w,h){f.width=w;f.height=h;f.style.transform=w>900?'scale(.75)':'none';document.getElementById('format').textContent=w+' × '+h}document.getElementById('portrait').onclick=()=>size(375,812);document.getElementById('landscape').onclick=()=>size(812,375);document.getElementById('small').onclick=()=>size(320,568);document.getElementById('audit').onclick=()=>{const d=f.contentDocument,buttons=[...d.querySelectorAll('[data-control],.topbar button,.character,#mount')].map(b=>{const r=b.getBoundingClientRect();return {name:b.getAttribute('aria-label')||b.textContent.trim(),x:Math.round(r.x),y:Math.round(r.y),width:Math.round(r.width),height:Math.round(r.height),inViewport:r.x>=0&&r.y>=0&&r.right<=Number(f.width)&&r.bottom<=Number(f.height)}});document.getElementById('report').textContent=JSON.stringify({viewport:[Number(f.width),Number(f.height)],horizontalOverflow:d.documentElement.scrollWidth>Number(f.width),verticalOverflow:d.documentElement.scrollHeight>Number(f.height),buttons},null,2)};</script></body></html>
